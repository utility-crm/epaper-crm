<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading your newspaper…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f11;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      gap: 20px;
    }
    .logo {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #fff 30%, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #e11d48;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg {
      font-size: 0.875rem;
      color: #777;
      text-align: center;
    }
    .error {
      color: #f87171;
      font-size: 0.875rem;
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="logo">epaperspace</div>
  <div class="spinner" id="spinner"></div>
  <p class="msg" id="msg">Loading your newspaper…</p>

  <script>
    (async () => {
      const host = window.location.hostname;
      try {
        const res = await fetch(
          `https://api.epaperspace.com/api/domain/resolve?host=${encodeURIComponent(host)}`
        );
        const json = await res.json();
        if (json?.data?.slug) {
          const slug = json.data.slug;
          // Preserve any path/query (e.g. deep links)
          const rest = window.location.pathname + window.location.search + window.location.hash;
          window.location.replace(`https://epaperspace.com/read/${slug}${rest}`);
        } else {
          showError('No publication found for <strong>' + host + '</strong>.<br/>Please check your domain configuration.');
        }
      } catch (e) {
        showError('Could not connect to the publication server.<br/>Please try again in a moment.');
      }
    })();

    function showError(html) {
      document.getElementById('spinner').style.display = 'none';
      const msg = document.getElementById('msg');
      msg.className = 'error';
      msg.innerHTML = html;
    }
  </script>
</body>
</html>
