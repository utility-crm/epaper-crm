name: Deploy Infrastructure

on:
  push:
    branches:
      - main

jobs:
  # Verify that every tenant _DB binding is present in all three wrangler configs
  # before deploying anything. A missing binding causes silent 401s at runtime.
  validate-bindings:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate tenant bindings are consistent across workers
        run: node scripts/validate-bindings.js

  # Deploy backend workers in parallel. Gateway is excluded here: it holds service
  # bindings to these workers (AUTH_WORKER among them), so it must deploy only after
  # they exist — otherwise the binding resolves to a missing service.
  deploy-workers:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    needs: validate-bindings
    strategy:
      matrix:
        worker: [admin, auth, provision, content, billing-platform, billing-tenant]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=workers/${{ matrix.worker }}

  # Deploy the gateway only after every worker it binds is live.
  deploy-gateway:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    needs: deploy-workers
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Gateway Shell
        env:
          VITE_CRM_REMOTE_URL: 'https://epaper-crm.pages.dev'
          VITE_PORTAL_REMOTE_URL: 'https://epaper-portal.pages.dev'
        run: npm run build --workspace=frontend/shell

      - name: Deploy Gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=workers/gateway

  # Deploy Tenant Portal (epaper-portal.pages.dev)
  deploy-portal:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Tenant Portal
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build --workspace=frontend/tenant-portal

      - name: Deploy to Cloudflare Pages (epaper-portal)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy frontend/tenant-portal/dist --project-name=epaper-portal --branch=main

      # epaper-reader serves the tenant reader domains (custom domains CNAME here,
      # wired in workers/admin/src/domain.ts). Same build as the portal — deploy the
      # identical dist so the reader never drifts behind the portal.
      - name: Deploy to Cloudflare Pages (epaper-reader)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy frontend/tenant-portal/dist --project-name=epaper-reader --branch=main

  # Deploy CRM (epaper-crm.pages.dev)
  deploy-crm:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build CRM
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build --workspace=frontend/crm

      - name: Deploy to Cloudflare Pages (epaper-crm)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy frontend/crm/dist --project-name=epaper-crm --branch=main
