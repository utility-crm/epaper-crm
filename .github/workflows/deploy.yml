name: Deploy Infrastructure

on:
  push:
    branches:
      - main

jobs:
  deploy-workers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [admin, provision, content, billing-platform, billing-tenant, gateway]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Gateway Shell
        if: ${{ matrix.worker == 'gateway' }}
        env:
          VITE_CRM_REMOTE_URL: 'https://epaper-crm.pages.dev'
          VITE_PORTAL_REMOTE_URL: 'https://epaper-portal.pages.dev'
        run: npm run build --workspace=frontend/shell
        
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=workers/${{ matrix.worker }}
