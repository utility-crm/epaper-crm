name: Deprovision Tenant

on:
  workflow_dispatch:
    inputs:
      tenant_slug:
        description: 'Tenant Slug'
        required: true
        type: string

concurrency: 
  group: tenant-${{ github.event.inputs.tenant_slug }}
  cancel-in-progress: true

jobs:
  deprovision:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        
      - name: Make script executable
        run: chmod +x scripts/deprovision.sh
        
      - name: Run Deprovisioning
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/deprovision.sh ${{ github.event.inputs.tenant_slug }}

      # Strip the tenant's {SLUG}_DB/_R2 bindings from the wrangler configs BEFORE
      # deploying, so the workers below don't ship with a binding that points at the
      # now-deleted D1/R2 (which would fail the deploy). Mirrors the provision flow,
      # which injects bindings before deploy. The later Commit step re-derives the
      # same edit from origin/main purely to persist it back to git.
      - name: Remove Bindings
        env:
          TENANT_SLUG: ${{ github.event.inputs.tenant_slug }}
        run: node scripts/remove-binding.js "$TENANT_SLUG"

      - name: Deploy Content Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=workers/content
        
      - name: Deploy Billing Tenant Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=workers/billing-tenant

      - name: Deploy Auth Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=workers/auth

      - name: Commit and Push Wrangler Configs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for i in {1..20}; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/remove-binding.js ${{ github.event.inputs.tenant_slug }}
            git add workers/content/wrangler.jsonc workers/billing-tenant/wrangler.jsonc workers/auth/wrangler.jsonc
            git commit -m "chore: remove bindings for ${{ github.event.inputs.tenant_slug }}" || break
            if git push origin main; then
              break
            fi
            sleep $((RANDOM % 5 + 1))
          done

      # Purge Cloudflare cache for all URLs belonging to this tenant slug.
      # This ensures any cached API responses for deleted tenant data are cleared immediately.
      # Non-fatal: if CLOUDFLARE_ZONE_ID secret is not set, curl will fail and the echo fallback runs.
      - name: Purge Cloudflare Cache for Tenant
        run: |
          SLUG="${{ github.event.inputs.tenant_slug }}"
          # Purge all possible tenant API URL prefixes
          curl -f -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"prefixes\": [\"/api/content/${SLUG}/\", \"/api/read/${SLUG}/\", \"/api/billing/tenant/${SLUG}/\"]}" \
            || echo "Cache purge skipped or failed (non-fatal)"

      - name: Report Completion to Provision Worker
        if: success()
        run: |
          curl -f -s -X POST https://epaper-gateway.satishkumar-link.workers.dev/api/provision/webhook \
            -H "Content-Type: application/json" \
            -d '{"secret": "${{ secrets.PROVISION_WEBHOOK_SECRET }}", "slug": "${{ github.event.inputs.tenant_slug }}", "isDeprovision": true}'

      - name: Report Failure to Provision Worker
        if: failure()
        run: |
          echo "Deprovision failed for ${{ github.event.inputs.tenant_slug }} — manual cleanup may be needed"
