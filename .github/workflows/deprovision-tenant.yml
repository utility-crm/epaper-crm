name: Deprovision Tenant

on:
  workflow_dispatch:
    inputs:
      tenant_slug:
        description: 'Tenant Slug'
        required: true
        type: string

jobs:
  deprovision:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: npm ci
        
      - name: Make script executable
        run: chmod +x scripts/deprovision.sh
        
      - name: Run Deprovisioning
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/deprovision.sh ${{ github.event.inputs.tenant_slug }}
        
      - name: Deploy Content Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=workers/content
        
      - name: Deploy Billing Tenant Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=workers/billing-tenant
        
      - name: Commit and Push Wrangler Configs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add workers/content/wrangler.jsonc workers/billing-tenant/wrangler.jsonc
          git commit -m "chore: remove bindings for ${{ github.event.inputs.tenant_slug }}"
          git push
