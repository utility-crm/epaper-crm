name: Provision Tenant

on:
  workflow_dispatch:
    inputs:
      tenant_slug:
        description: 'Tenant Slug'
        required: true
        type: string

jobs:
  provision:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: npm ci
        
      - name: Make script executable
        run: chmod +x scripts/provision.sh
        
      - name: Run Provisioning
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/provision.sh ${{ github.event.inputs.tenant_slug }}
        
      - name: Apply DB Schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 0003 is a legacy transform for DBs created before 0001 was rewritten to the
          # restructured shape; it errors on a fresh DB, so skip it for new tenants.
          for f in $(ls migrations/tenant/*.sql | sort); do
            case "$f" in
              *0003_*) echo "Skipping legacy migration $f"; continue ;;
            esac
            echo "Applying $f"
            npx wrangler d1 execute epaper-${{ github.event.inputs.tenant_slug }} --remote --file="$f"
          done
        
      - name: Deploy Content Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=workers/content
        
      - name: Deploy Billing Tenant Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=workers/billing-tenant
        
      - name: Commit and Push Wrangler Configs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add workers/content/wrangler.jsonc workers/billing-tenant/wrangler.jsonc
          git commit -m "chore: inject bindings for ${{ github.event.inputs.tenant_slug }}" || true
          git pull --rebase origin main || true
          git push

      # Always runs last — reports success or failure. Uses -f so curl itself fails on HTTP errors.
      - name: Report Success to Provision Worker
        if: success()
        run: |
          curl -f -s -X POST https://epaper-gateway.satishkumar-link.workers.dev/api/provision/webhook \
            -H "Content-Type: application/json" \
            -d '{"secret": "${{ secrets.PROVISION_WEBHOOK_SECRET }}", "slug": "${{ github.event.inputs.tenant_slug }}", "isDeprovision": false}'

      - name: Rollback Infrastructure
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Provisioning failed, rolling back resources..."
          chmod +x scripts/deprovision.sh || true
          ./scripts/deprovision.sh ${{ github.event.inputs.tenant_slug }} || true

      - name: Report Failure to Provision Worker
        if: failure()
        run: |
          curl -f -s -X POST https://epaper-gateway.satishkumar-link.workers.dev/api/provision/webhook \
            -H "Content-Type: application/json" \
            -d '{"secret": "${{ secrets.PROVISION_WEBHOOK_SECRET }}", "slug": "${{ github.event.inputs.tenant_slug }}", "isDeprovision": false, "isFailure": true}'
