name: Apply Database Migrations

on:
  push:
    branches: [ main ]
    paths:
      - 'migrations/**'
  workflow_dispatch:
    inputs:
      category:
        description: 'Migration category to apply'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - tenant
          - control
      tenant_slug:
        description: 'Optional: Specific tenant slug to migrate (only applies when category is tenant or all)'
        required: false
        type: string

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changed Migration Categories
    runs-on: ubuntu-latest
    outputs:
      control: ${{ steps.filter.outputs.control }}
      tenant: ${{ steps.filter.outputs.tenant }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            control:
              - 'migrations/control/**'
            tenant:
              - 'migrations/tenant/**'

      - name: Override for Workflow Dispatch
        id: dispatch_override
        if: github.event_name == 'workflow_dispatch'
        run: |
          CATEGORY="${{ github.event.inputs.category }}"
          if [ "$CATEGORY" = "all" ] || [ "$CATEGORY" = "control" ]; then
            echo "control=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$CATEGORY" = "all" ] || [ "$CATEGORY" = "tenant" ]; then
            echo "tenant=true" >> "$GITHUB_OUTPUT"
          fi

  migrate-control:
    name: Apply Control Migrations (epaper-control)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.control == 'true' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.category == 'all' || github.event.inputs.category == 'control'))
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Apply Migrations to epaper-control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "================================================="
          echo "Migrating Control Database: epaper-control"
          echo "================================================="

          # Migration ledger, same as scripts/migrate-all-tenants.sh: a file is applied
          # once and skipped only when it is recorded in _migrations.
          npx wrangler d1 execute epaper-control --remote \
            --command "CREATE TABLE IF NOT EXISTS _migrations (name TEXT PRIMARY KEY, applied_at DATETIME DEFAULT CURRENT_TIMESTAMP);" \
            > /dev/null

          for f in $(ls migrations/control/*.sql | sort); do
            NAME=$(basename "$f")

            LEDGER=$(npx wrangler d1 execute epaper-control --remote \
              --command "SELECT name FROM _migrations WHERE name='$NAME';" \
              --json 2>/dev/null || echo "")
            if echo "$LEDGER" | grep -q "\"$NAME\""; then
              echo "  [SKIP] $NAME already recorded in _migrations"
              continue
            fi

            echo "Applying $NAME to epaper-control..."
            # Schema change and its ledger insert go in ONE wrangler call: D1 runs a
            # multi-statement file as a single transaction, so a failed or partially
            # applied file never gets recorded as complete.
            TMP=$(mktemp)
            cat "$f" > "$TMP"
            printf "\nINSERT OR IGNORE INTO _migrations (name) VALUES ('%s');\n" "$NAME" >> "$TMP"
            if npx wrangler d1 execute epaper-control --remote --file="$TMP"; then
              rm -f "$TMP"
              echo "  [OK] $NAME"
            else
              rm -f "$TMP"
              echo "  [FAIL] Error applying $NAME to epaper-control"
              exit 1
            fi
          done

  migrate-tenants:
    name: Apply Tenant Migrations (epaper-<slug>)
    runs-on: ubuntu-latest
    needs: [detect-changes, migrate-control]
    if: |
      always() &&
      (needs.detect-changes.outputs.tenant == 'true' ||
       (github.event_name == 'workflow_dispatch' && (github.event.inputs.category == 'all' || github.event.inputs.category == 'tenant'))) &&
      (needs.migrate-control.result == 'success' || needs.migrate-control.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Apply Migrations to Tenant Databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SPECIFIC_SLUG="${{ github.event.inputs.tenant_slug }}"
          if [ -n "$SPECIFIC_SLUG" ]; then
            echo "Manual target: Single tenant slug specified ($SPECIFIC_SLUG)"
            TENANTS="$SPECIFIC_SLUG"
          else
            echo "Discovering all active tenant databases from epaper-control..."
            TENANTS=$(npx wrangler d1 execute epaper-control --remote --json --command="SELECT slug FROM tenants WHERE status != 'pending' AND d1_id IS NOT NULL" | jq -r '.[0].results[].slug')
          fi

          if [ -z "$TENANTS" ]; then
            echo "No tenant databases found to migrate."
            exit 0
          fi

          SUCCESS_COUNT=0
          FAIL_COUNT=0
          FAILED_TENANTS=""

          for SLUG in $TENANTS; do
            DB_NAME="epaper-$SLUG"

            # CRITICAL SAFETY CHECK: Ensure we NEVER apply tenant migrations to epaper-control
            if [ "$DB_NAME" = "epaper-control" ]; then
              echo "WARNING: Skipping epaper-control in tenant loop to prevent cross-category contamination!"
              continue
            fi

            echo ""
            echo "================================================="
            echo "Migrating Tenant Database: $DB_NAME"
            echo "================================================="

            npx wrangler d1 execute "$DB_NAME" --remote \
              --command "CREATE TABLE IF NOT EXISTS _migrations (name TEXT PRIMARY KEY, applied_at DATETIME DEFAULT CURRENT_TIMESTAMP);" \
              > /dev/null

            TENANT_FAILED=false
            for f in $(ls migrations/tenant/*.sql | sort); do
              NAME=$(basename "$f")
              case "$NAME" in
                *0003_*) echo "  [SKIP] $NAME (legacy)"; continue ;;
              esac

              LEDGER=$(npx wrangler d1 execute "$DB_NAME" --remote \
                --command "SELECT name FROM _migrations WHERE name='$NAME';" \
                --json 2>/dev/null || echo "")
              if echo "$LEDGER" | grep -q "\"$NAME\""; then
                echo "  [SKIP] $NAME already recorded in _migrations"
                continue
              fi

              echo "  -> Applying $NAME to $DB_NAME..."
              # Same one-transaction apply+record as the control loop: a failed or
              # partially applied file is never marked complete.
              TMP=$(mktemp)
              cat "$f" > "$TMP"
              printf "\nINSERT OR IGNORE INTO _migrations (name) VALUES ('%s');\n" "$NAME" >> "$TMP"
              if npx wrangler d1 execute "$DB_NAME" --remote --file="$TMP"; then
                rm -f "$TMP"
                echo "  [OK] $NAME"
              else
                rm -f "$TMP"
                echo "  [FAIL] Error applying $NAME to $DB_NAME"
                TENANT_FAILED=true
                break
              fi
            done

            if [ "$TENANT_FAILED" = "true" ]; then
              FAIL_COUNT=$((FAIL_COUNT + 1))
              FAILED_TENANTS="$FAILED_TENANTS $DB_NAME"
            else
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            fi
          done

          echo ""
          echo "================================================="
          echo "Tenant Migration Summary"
          echo "================================================="
          echo "Successful tenants: $SUCCESS_COUNT"
          echo "Failed tenants:     $FAIL_COUNT"
          if [ $FAIL_COUNT -gt 0 ]; then
            echo "Failed database(s):$FAILED_TENANTS"
            exit 1
          fi
